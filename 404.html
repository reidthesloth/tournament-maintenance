<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Reidthesloth | Temporarily Offline</title>
  <style>
    *{box-sizing:border-box}
    body{
      margin:0;min-height:100vh;display:grid;place-items:center;
      background:radial-gradient(circle at top,#1f2937,#050505 65%);
      color:#fff;font-family:Arial,Helvetica,sans-serif;
    }
    .card{max-width:720px;padding:56px 28px;text-align:center}
    .eyebrow{font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:#93c5fd}
    h1{font-size:clamp(38px,8vw,64px);margin:14px 0}
    p{font-size:18px;line-height:1.6;color:#cbd5e1}
    .status{display:inline-flex;gap:10px;align-items:center;margin-top:20px;padding:10px 18px;
      border:1px solid #334155;border-radius:999px;background:#0f172a}
    .dot{width:10px;height:10px;border-radius:50%;background:#f59e0b;animation:pulse 1.4s infinite}
    button{margin-top:28px;padding:12px 20px;border:0;border-radius:10px;font-weight:700;cursor:pointer}
    @keyframes pulse{50%{opacity:.25}}
  </style>
</head>
<body>
  <main class="card">
    <div class="eyebrow">Reidthesloth Tournament Control</div>
    <h1>We'll Be Back Tomorrow</h1>
    <p>The tournament system is currently unavailable or undergoing maintenance.</p>
    <p>If you need access please message Reid </p>
    <p>Please check back shortly. This page will retry automatically.</p>
    <div class="status"><span class="dot"></span> System Temporarily Offline</div><br>
    <button onclick="location.reload()">Try Again</button>
  </main>
  <script>setTimeout(()=>location.reload(),30000);</script>
</body>
</html>
